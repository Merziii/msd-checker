name: MSD Schedule Monitor

on:
  schedule:
    # Philippine Time (UTC+8): 6:00 AM to 9:00 PM = UTC 10:00 PM to 1:00 PM
    - cron: '0 22-23 * * *'   # 6:00 AM – 7:00 AM PHT
    - cron: '0 0-13 * * *'    # 8:00 AM – 9:00 PM PHT

  # Allows you to trigger a manual run from the GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  check-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run MSD monitor
        env:
          SCHOLARSHIP_CATEGORY: ${{ secrets.SCHOLARSHIP_CATEGORY }}
          CARECARD:             ${{ secrets.CARECARD }}
          PASSWORD:             ${{ secrets.PASSWORD }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py